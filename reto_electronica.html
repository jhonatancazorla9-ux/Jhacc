<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Reto Electrónica — Juego de preguntas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#10272B;--mut:#4A6366;--ac:#F2A93B;--tl:#2F9E94;--dk:#0F2A2E;--line:#E2DDD0;--ok:#1E8E5A;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1D20;--card:#12302F;--ink:#EEF4F2;--mut:#A9C3BF;--line:#244846;--tl:#4FC3B8}}
:root[data-theme="dark"]{--bg:#0B1D20;--card:#12302F;--ink:#EEF4F2;--mut:#A9C3BF;--line:#244846;--tl:#4FC3B8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:auto;padding:18px 18px 60px}
.hero{background:var(--dk);color:#F4F1EA;border-radius:24px;padding:26px 22px;text-align:center;animation:up .5s both}
.hero h1{margin:6px 0;font-size:34px;line-height:1.1}.hero p{margin:6px 0;color:#C9DAD6}.big{font-size:72px;line-height:1;margin:0;animation:pop .6s both}
h2{font-size:22px;margin:22px 0 8px}
.btn{border:0;border-radius:16px;padding:15px 22px;font:700 18px Inter,sans-serif;cursor:pointer;background:var(--ac);color:#10272B;width:100%;margin-top:12px;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.g{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font:700 17px Inter,sans-serif;cursor:pointer;transition:.2s}.pick.on{border-color:var(--tl);background:var(--tl);color:#fff;transform:scale(1.03)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:19px;margin-bottom:8px}
.tm{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.tm i{display:block;height:100%;width:100%;background:var(--tl);transition:width 1s linear,background .3s}.tm i.low{background:var(--bad)}
.q{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--ac);border-radius:20px;padding:20px;margin:14px 0;font-size:22px;font-weight:700;line-height:1.3;animation:up .35s both}
.q small{display:block;color:var(--tl);font-size:14px;letter-spacing:1.5px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 18px Inter,sans-serif;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){border-color:var(--tl);transform:translateX(4px)}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .4s}
.fb{border-radius:16px;padding:14px 16px;margin-top:10px;background:var(--card);border:1px solid var(--line);animation:up .3s both}.fb b{font-size:20px}.fb p{margin:6px 0 0;color:var(--mut);font-size:16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="m"></main>
<script>
const D={"obj": ["Formar profesionales a nivel Técnico Medio con conocimientos en análisis de circuitos electrónicos, instalaciones eléctricas en baja tensión y robótica, capaces de desarrollar el mantenimiento preventivo y correctivo de dispositivos electrónicos, máquinas eléctricas y equipos eléctricos de baja tensión.", "Además de proporcionar la capacidad creativa para el desarrollo de proyectos de emprendimiento productivo e innovación tecnológica, para contribuir a la transformación de la matriz productiva y la reactivación económica del Estado Plurinacional de Bolivia, involucrando valores sociocomunitarios orientados a la preservación de la Madre Tierra y el cuidado del medioambiente."], "y": {"4": {"l": "Nivel inicial de la especialidad", "s": "Seguridad Industrial, Gestión Ambiental, Matemática I e Introducción a la Electrónica", "p": ["Conoce y aplica normas de seguridad industrial y salud ocupacional en el taller de electrónica.", "Desarrolla prácticas y procedimientos de primeros auxilios frente a los accidentes laborales más comunes.", "Conoce y analiza el funcionamiento de los componentes electrónicos, los riesgos en su utilización y adopta criterios para el trabajo seguro, empleando normas de higiene, seguridad industrial y cuidado medioambiental, demostrando responsabilidad, honestidad y trabajo en equipo, basado en valores humanos y equidad de género."], "t": {"1": [{"t": "SEGURIDAD Y SALUD OCUPACIONAL", "n": "Todo taller seguro empieza por conocer las normas y usar la protección correcta.", "i": ["Normas de seguridad", "Normas técnicas para ambientes de trabajo", "Indumentaria e implementos de seguridad y bioseguridad", "Equipos de protección personal", "Protectores corporales y extremidades", "Normas y cuidados específicos", "Señalización de seguridad", "Colores de seguridad", "Tipos de señales", "Prevención de incendios", "Primeros auxilios", "Principios básicos y normas de actuación en primeros auxilios"], "e": "🦺"}, {"t": "DERECHO LABORAL", "n": "Conocer tus derechos y obligaciones como futuro técnico medio.", "i": ["Derecho al trabajo y al empleo", "Ley General del Trabajo", "Responsabilidades y derechos del trabajador y empleador"], "e": "⚖️"}, {"t": "SISTEMAS DE GESTIÓN AMBIENTAL ISO 14001", "n": "Cuidar la Madre Tierra también es parte del trabajo técnico.", "i": ["Consumo y uso responsable de los recursos naturales", "Manejo eficiente del agua", "Ahorro de energía", "Manejo de residuos sólidos y líquidos", "Aplicación de políticas ambientales acústicas, visuales y respiratorias", "Análisis de la contaminación del medioambiente", "Empresas que cumplen con la ISO 14001 en Bolivia"], "e": "🌿"}], "2": [{"t": "INTRODUCCIÓN A LA ELECTRÓNICA", "n": "Un recorrido por la historia y el futuro de la electrónica.", "i": ["Introducción", "Antecedentes históricos de la electrónica", "La automática", "Avanzando a una nueva era"], "e": "🕰️"}, {"t": "MATEMÁTICA APLICADA A ELECTRÓNICA I", "n": "Las herramientas matemáticas que se usan al calcular circuitos.", "i": ["Proporcionalidad y porcentaje", "Razones y proporciones", "Magnitudes proporcionales", "Regla de tres", "Porcentaje", "Aplicaciones a la electrónica"], "e": "🧮"}, {"t": "MANEJO APLICACIÓN DE DISPOSITIVOS MÓVILES O CALCULADORAS PARA LA TECNOLOGÍA ELECTRÓNICA", "n": "Calculadoras avanzadas para resolver problemas técnicos con rapidez.", "i": ["Texas Instruments Voyage 200", "HP Prime"], "e": "📱"}], "3": [{"t": "COMPONENTES ELECTRÓNICOS", "n": "Reconocer cada componente y probarlo en el laboratorio.", "i": ["Componentes electrónicos y sus funciones", "Laboratorio"], "e": "🔌"}, {"t": "FÍSICA PARA ELECTRÓNICA", "n": "La física que explica cómo funcionan los circuitos.", "i": ["Magnetismo", "Electrostática", "Electromagnetismo: Radiación electromagnética"], "e": "🧲"}, {"t": "PRODUCTO TECNOLÓGICO CON ELECTROIMÁN", "n": "Primer producto práctico: aplicar el electromagnetismo.", "i": ["Relé", "Cerradura eléctrica"], "e": "🔒"}]}}, "5": {"l": "Nivel intermedio", "s": "Circuitos Analógicos, Placas PCB, Inglés Técnico, Lógica Digital y Emprendimiento", "p": ["Conoce los circuitos analógicos y digitales, elabora placas electrónicas PCB y analiza dispositivos electrónicos a través de medidas obtenidas por instrumentos electrónicos, demostrando responsabilidad y orden en el taller.", "Elabora su perfil de grado, brindando respuestas a las demandas, necesidades y potencialidades locales o regionales, mediante emprendimientos productivos y propuestas de innovación con enfoque sociocomunitario productivo, contribuyendo a la reactivación económica y productiva de la región."], "t": {"1": [{"t": "MATEMÁTICA APLICADA A ELECTRÓNICA II", "n": "Matemática más avanzada para analizar redes eléctricas.", "i": ["Álgebra lineal aplicada", "Números complejos", "Geometría analítica y del espacio"], "e": "🧮"}, {"t": "ANÁLISIS DE CIRCUITOS", "n": "Cómo calcular voltajes y corrientes en cualquier circuito.", "i": ["Definiciones y unidades", "Circuitos en serie, paralelo y mixto", "Métodos de análisis de circuitos", "Teoremas de redes", "Análisis en régimen transitorio"], "e": "〰️"}, {"t": "ELECTRÓNICA ANALÓGICA", "n": "Los dispositivos que amplifican y controlan señales.", "i": ["El diodo semiconductor", "El transistor bipolar (BJT)", "Amplificadores de potencia", "Fuentes reguladas", "Circuitos integrados"], "e": "🔺"}, {"t": "PRODUCTO DE CIRCUITOS ANALÓGICOS BÁSICOS", "n": "Dos proyectos para llevar la teoría al taller.", "i": ["Generador de onda cuadrada con el CI NE555", "Amplificador de audio con el CI LM380N"], "e": "⚡"}], "2": [{"t": "INSTRUMENTOS Y COMPONENTES ELECTRÓNICOS PARA LA PRODUCCIÓN", "n": "Medir, soldar y fabricar placas con precisión.", "i": ["Unidades de medida en electrónica", "Instrumentos básicos de medición", "Técnicas de soldadura", "Componentes pasivos", "Resistores especiales (LDR, TDR y VRD)", "Capacitores polarizados y no polarizados", "Componentes activos", "Diseño y montaje de circuitos impresos", "El osciloscopio y generador de funciones"], "e": "⚙️"}, {"t": "PRODUCTO TECNOLÓGICO", "n": "Fuentes de alimentación listas para usar en tu banco de trabajo.", "i": ["Fuente regulable de 0 a 30V", "Fuente simétrica de +12V/-12V"], "e": "🔋"}, {"t": "INGLÉS TÉCNICO MACHINES AND EQUIPMENTS", "n": "Vocabulario en inglés para leer manuales y fichas técnicas.", "i": ["Types of machines and equipments", "Specific information (equipments and machines)", "Maintenance and procedures", "Special vocabulary", "Exercises and activities", "Technical worksheets", "Technical processes"], "e": "📘"}], "3": [{"t": "ELECTRÓNICA DIGITAL", "n": "La lógica de unos y ceros que está detrás de todo equipo digital.", "i": ["Conceptos digitales", "Sistemas de numeración, operaciones y códigos", "Compuertas lógicas", "Álgebra de Boole y simplificación lógica", "Circuitos combinacionales", "Dispositivos lógicos programables", "Simuladores (programas de simulación en software)"], "e": "🔲"}, {"t": "PRODUCTO DE CIRCUITOS DIGITAL BÁSICOS", "n": "Proyectos digitales que se pueden ver funcionando.", "i": ["Semáforo", "Decodificador BCD a 7 segmentos"], "e": "🚦"}, {"t": "CREATIVIDAD, INNOVACIÓN Y EMPRENDIMIENTO", "n": "De una buena idea a un negocio real.", "i": ["Creatividad e innovación", "Emprendimiento", "Cualidades de un emprendedor", "Estudio de mercado", "Modelo de negocio", "Plan de negocio", "De la idea a la acción"], "e": "💡"}, {"t": "MODALIDADES DE GRADUACIÓN EN EL BACHILLERATO TÉCNICO HUMANÍSTICO", "n": "Las opciones para titularte como Técnico Medio.", "i": ["Modalidades de graduación", "Proyecto de Emprendimiento Productivo", "Proyecto de Innovación", "Práctica laboral comunitaria", "Perfil de grado"], "e": "🎓"}]}}, "6": {"l": "Nivel avanzado de especialidad", "s": "Programación Arduino, Robótica, Circuitos CA, Instalaciones NB-777, Mantenimiento y Defensa de Grado", "p": ["Realiza el mantenimiento preventivo y correctivo de dispositivos electrónicos, planifica y desarrolla instalaciones eléctricas en baja tensión, elabora prototipos de electrónica automatizada, integrando conocimientos de robótica y programación con capacidad crítica, contribuyendo a la transformación de la matriz productiva del Estado Plurinacional de Bolivia.", "Emprende proyectos productivos individuales y comunitarios en el ámbito de la electrónica, respondiendo a las demandas, problemáticas y necesidades del contexto desde las potencialidades y vocaciones productivas locales, regionales y territoriales."], "t": {"1": [{"t": "PROGRAMACIÓN APLICADO A ELECTRÓNICA", "n": "Programar es darle inteligencia a los circuitos.", "i": ["Algoritmos", "Lenguajes de programación", "Estructuras secuenciales", "Estructuras condicionales", "Estructuras repetitivas", "Arreglos", "Programación y microcontroladores en proyectos de innovación", "Microcontrolador Arduino", "Programación de Arduino", "Proyectos de aplicación: elaboración de un robot (robótica)"], "e": "🤖"}, {"t": "MATEMÁTICA APLICADA A ELECTRÓNICA III", "n": "Matemática de nivel avanzado para el análisis de señales.", "i": ["Ecuaciones diferenciales ordinarias", "La transformada de Laplace", "Series de Fourier"], "e": "🧮"}], "2": [{"t": "ANÁLISIS DE CIRCUITOS II", "n": "Corriente alterna: la base de la energía y las telecomunicaciones.", "i": ["Formas de ondas senoidal alterna", "Análisis fasorial", "Métodos de análisis de circuitos alternos", "Potencia compleja", "Circuitos resonantes", "Análisis de redes trifásicas", "Análisis del diagrama en bloques de receptor de radio AM y FM", "Análisis del diagrama en bloques de TV"], "e": "〰️"}, {"t": "INSTALACIONES ELÉCTRICAS SIMBOLOGÍA ELÉCTRICA SISTEMAS DE BAJA, MEDIA Y ALTA TENSIÓN", "n": "Instalar con seguridad y según la norma boliviana.", "i": ["Norma boliviana NB-777", "Cableado eléctrico", "Instalaciones eléctricas", "Auxiliares y especiales", "Sistemas de protección eléctrica"], "e": "🔌"}], "3": [{"t": "MANTENIMIENTO CORRECTIVO Y PREVENTIVO DE ELECTRÓNICOS PARA LA COMUNIDAD", "n": "Servicio técnico real para tu comunidad.", "i": ["Ensamblaje y reparación de computadoras", "Mantenimiento de equipo de computación", "Instalación de sistemas operativos", "Tecnología de redes topología y cableado estructurado"], "e": "🖥️"}, {"t": "CABLEADO ESTRUCTURADO BÁSICO", "n": "Cómo se organizan los cables de una red.", "i": ["Introducción", "Componentes de un cableado estructurado", "Cables norma T568A y norma T568B", "Estándares de red"], "e": "🌐"}, {"t": "DEFENSA DE GRADO", "n": "El último paso para obtener el título de Técnico Medio en Electrónica.", "i": ["Ejecución de las modalidades de graduación", "Defensa de grado"], "e": "🎓"}]}}}};
const $=s=>document.querySelector(s),TN=["Primer trimestre","Segundo trimestre","Tercer trimestre"];
const all=[];[4,5,6].forEach(y=>[1,2,3].forEach(t=>D.y[y].t[t].forEach(o=>all.push({...o,y,tr:t}))));
const sh=a=>[...a].sort(()=>Math.random()-.5),pk=a=>a[Math.floor(Math.random()*a.length)];
const cnt={},yrs={};all.forEach(o=>o.i.forEach(x=>{cnt[x]=(cnt[x]||0)+1;(yrs[x]=yrs[x]||new Set()).add(o.y)}));
let best=0;try{best=+localStorage.getItem("elg")||0}catch(e){}
const G={mode:"all",s:null,tm:null};
const RANKS=[[1200,"🏆","Maestro electrónico"],[800,"🥇","Experto"],[400,"🔧","Técnico"],[0,"🌱","Aprendiz"]];
function ask(q,opts,c,o,tag){const ix=sh(opts.map((t,i)=>[t,i]));return{q,tag,o:opts.length==2?opts:ix.map(x=>x[0]),c:opts.length==2?c:ix.findIndex(x=>x[1]==c),n:o.n,t:o.t}}
function gen(mode){const pool=mode=="all"?all:all.filter(o=>o.y==+mode),Q=[],seen=new Set();
 const T={
 a(){const o=pk(pool),l=o.i.filter(x=>x.length>14&&yrs[x].size==1);if(!l.length)return;return ask("¿En qué año se estudia “"+pk(l)+"”?",["4° año","5° año","6° año"],o.y-4,o,"AÑO")},
 b(){const o=pk(pool);return ask("¿En qué trimestre del "+o.y+"° año se ve “"+o.t+"”?",TN,o.tr-1,o,"TRIMESTRE")},
 c(){const o=pk(pool),l=o.i.filter(x=>x.length>9&&cnt[x]==1);if(!l.length)return;const d=sh(all.filter(z=>z.y==o.y&&z.t!=o.t)).slice(0,3).map(z=>z.t);return ask("¿A qué tema pertenece “"+pk(l)+"”?",[o.t,...d],0,o,"CONTENIDOS")},
 d(){const o=pk(pool),f=Math.random()<.5;if(mode=="all"){const y=f?pk([4,5,6].filter(v=>v!=o.y)):o.y;return ask("Verdadero o falso: “"+o.t+"” se estudia en el "+y+"° año.",["Verdadero","Falso"],f?1:0,o,"VERDADERO / FALSO")}
  const t=f?pk([1,2,3].filter(v=>v!=o.tr)):o.tr;return ask("Verdadero o falso: “"+o.t+"” se ve en el "+TN[t-1].toLowerCase()+".",["Verdadero","Falso"],f?1:0,o,"VERDADERO / FALSO")},
 e(){const o=pk(pool);if(mode=="all"){const d=sh(all.filter(z=>z.y!=o.y)).slice(0,3).map(z=>z.t);return ask("¿Cuál de estos temas se estudia en el "+o.y+"° año?",[o.t,...d],0,o,"ELIGE EL TEMA")}
  const d=sh(all.filter(z=>z.y==o.y&&z.tr!=o.tr)).slice(0,3).map(z=>z.t);return ask("¿Cuál de estos temas se ve en el "+TN[o.tr-1].toLowerCase()+" del "+o.y+"° año?",[o.t,...d],0,o,"ELIGE EL TEMA")}};
 const ks=mode=="all"?["a","b","c","d","e"]:["b","c","d","e"];let g=0;
 while(Q.length<10&&g++<300){const q=T[ks[Q.length%ks.length]]();if(q&&!seen.has(q.q)){seen.add(q.q);Q.push(q)}}return sh(Q)}
function home(){clearInterval(G.tm);const L=["all","4","5","6"],N=["Todos los años","4° año","5° año","6° año"];
 $("#m").innerHTML=`<div class="hero"><p class="big">🎮</p><h1>RETO ELECTRÓNICA</h1><p>Pon a prueba lo que sabes de la Carrera Técnica en Electrónica.</p><p>🏅 Tu mejor puntaje: <b>${best}</b></p></div><h2>1. Elige el reto</h2><div class="row">${L.map((l,i)=>`<button class="pick ${G.mode==l?"on":""}" data-a="mode" data-v="${l}">${N[i]}</button>`).join("")}</div><h2>2. Reglas</h2><div class="fb"><p>❤️ Tienes 3 vidas. ⏱️ 20 segundos por pregunta. Cuanto más rápido respondas, más puntos ganas, y si aciertas seguido tu 🔥 racha suma bonos.</p></div><button class="btn" data-a="go">¡Jugar!</button>`}
function start(){G.s={q:gen(G.mode),i:0,pts:0,lives:3,streak:0,ok:0,a:null,t:20};play()}
function tick(){const s=G.s;s.t--;const b=$("#tb");if(b){b.style.width=Math.max(0,s.t/20*100)+"%";b.className=s.t<=5?"low":""}$("#tt").textContent="⏱️ "+Math.max(0,s.t);if(s.t<=0){clearInterval(G.tm);answer(-1)}}
function play(){const s=G.s;if(s.i>=s.q.length||s.lives<=0)return end();const q=s.q[s.i];s.a=null;s.t=20;clearInterval(G.tm);
 $("#m").innerHTML=`<div class="hud"><span>${"❤️".repeat(s.lives)}${"🖤".repeat(3-s.lives)}</span><span id="tt">⏱️ 20</span><span>🔥 ${s.streak}</span><span>⭐ ${s.pts}</span></div><div class="tm"><i id="tb"></i></div><div class="q"><small>PREGUNTA ${s.i+1} DE ${s.q.length} · ${q.tag}</small>${q.q}</div>${q.o.map((t,i)=>`<button class="opt" data-a="ans" data-v="${i}">${t}</button>`).join("")}<div id="fb"></div>`;
 G.tm=setInterval(tick,1000)}
function answer(i){const s=G.s,q=s.q[s.i];if(s.a!=null)return;clearInterval(G.tm);s.a=i;const ok=i==q.c;let add=0;
 if(ok){s.streak++;s.ok++;add=100+Math.ceil(s.t/20*50)+Math.min(s.streak,5)*10;s.pts+=add}else{s.streak=0;s.lives--}
 document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k==q.c)b.classList.add("good");else if(k==i)b.classList.add("bad")});
 $("#fb").innerHTML=`<div class="fb"><b>${ok?"✅ ¡Correcto! +"+add+" puntos":(i<0?"⏰ ¡Se acabó el tiempo!":"❌ Incorrecto")}</b><p>Tema: ${q.t} — ${q.n}</p></div><button class="btn" data-a="next">${s.i+1<s.q.length&&s.lives>0?"Siguiente →":"Ver resultado"}</button>`;
 $("#fb").scrollIntoView({behavior:"smooth",block:"end"})}
function end(){clearInterval(G.tm);const s=G.s,r=RANKS.find(x=>s.pts>=x[0]),nw=s.pts>best;if(nw){best=s.pts;try{localStorage.setItem("elg",best)}catch(e){}}
 $("#m").innerHTML=`<div class="hero"><p class="big">${r[1]}</p><h1>${r[2]}</h1><p>${s.lives<=0?"Te quedaste sin vidas, ¡inténtalo otra vez!":"¡Terminaste el reto!"}</p>${nw?"<p><b>🎉 ¡Nuevo récord!</b></p>":""}</div><div class="stat"><div><b>${s.pts}</b><span>PUNTOS</span></div><div><b>${s.ok}/${s.q.length}</b><span>ACIERTOS</span></div><div><b>${best}</b><span>MEJOR</span></div></div><button class="btn" data-a="go">Jugar otra vez</button><button class="btn g" data-a="home">Cambiar de reto</button>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a=="mode"){G.mode=b.dataset.v;home()}else if(a=="go")start();else if(a=="ans")answer(+b.dataset.v);else if(a=="next"){G.s.i++;play()}else if(a=="home")home()});
home();
</script></body></html>
